name: Fix Suite v0.8.7 README

on:
  push:
    branches:
      - release/v0.8.7
    paths:
      - '.github/workflows/fix-v087-readme.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.8.7
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Kingshade%20Suite-0\.8\.6-green/Kingshade%20Suite-0.8.7-green/' README.md
          sed -i 's/Temporary diagnostics, test notes, ZIP archives and duplicate script copies do not belong in the repository root\./Temporary diagnostics, test notes, ZIP archives and temporary duplicate script copies do not belong in the repository root; published historical versioned snapshots are retained for link stability./' README.md
          grep -Fq 'Kingshade%20Suite-0.8.7-green' README.md
          bash tools/validate-suite.sh
          git rm .github/workflows/fix-v087-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Fix v0.8.7 README release metadata'
          git push origin HEAD:release/v0.8.7
