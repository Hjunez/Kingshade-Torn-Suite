name: KSMA metadata hotfix

on:
  push:
    branches:
      - fix-ksma-v0-9-3-1-metadata
    paths:
      - '.github/workflows/ksma-metadata-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ksma-v0-9-3-1-metadata
          fetch-depth: 0

      - name: Patch and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Kingshades_Market_Advisor_v0.9.3.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @namespace    https://kingshade.tools/', '// @namespace    https://kingshade.tools/market-advisor')
          s = s.replace('// @version      0.9.3', '// @version      0.9.3.1', 1)
          s = s.replace("// @description  Kingshade's Market Advisor v0.9.3 release verification build based on approved RC5 with no functional changes.", "// @description  Kingshade's Market Advisor for Torn PDA — Item Market and Bazaar comparison with Happy Jump route planning.")
          marker = '// @author       Kingshade\n'
          urls = ('// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/Kingshades_Market_Advisor_v0.9.3.user.js\n'
                  '// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/Kingshades_Market_Advisor_v0.9.3.user.js\n')
          if '// @downloadURL' not in s:
              s = s.replace(marker, marker + urls, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "^// @name         Kingshade's Market Advisor$" Kingshades_Market_Advisor_v0.9.3.user.js
          grep -q '^// @namespace    https://kingshade.tools/market-advisor$' Kingshades_Market_Advisor_v0.9.3.user.js
          grep -q '^// @version      0.9.3.1$' Kingshades_Market_Advisor_v0.9.3.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/Kingshades_Market_Advisor_v0.9.3.user.js$' Kingshades_Market_Advisor_v0.9.3.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/Kingshades_Market_Advisor_v0.9.3.user.js$' Kingshades_Market_Advisor_v0.9.3.user.js

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ksma-metadata-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate KSMA metadata identity"
          git push origin HEAD:fix-ksma-v0-9-3-1-metadata
