name: Build KS Torn War Dibs 1.5.134 Hospital Clock Sync Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ks-war-dibs-v1.5.134/GO'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ks-war-dibs-v1.5.134-hospital-clock-sync
      - name: Build isolated test version
        shell: bash
        run: |
          set -euo pipefail
          cp KS_Torn_War_Dibs.user.js KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt')
          s = p.read_text()
          reps = [
              ('// @version      1.5.133', '// @version      1.5.134'),
              ('version: "1.5.133"', 'version: "1.5.134"'),
              ('KS Torn War Dibs v1.5.133 PATCH RELEASE', 'KS Torn War Dibs v1.5.134 HOSPITAL CLOCK SYNC TEST'),
              ('Math.round(apiStatus.until - getTornNowMs() / 1000)', 'Math.round(apiStatus.until - nowMs() / 1000)'),
              ('Math.round(until - getTornNowMs() / 1000)', 'Math.round(until - nowMs() / 1000)'),
          ]
          for old, new in reps:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          marker = ' * FF / Est separator, Hospital countdown, FF 2.00-5.00 gate and shared DIBS retained.\n'
          insert = marker + ' * TEST ONLY: Hospital countdown/gating uses the same local browser clock basis as FFScouter War Room.\n'
          if marker not in s:
              raise SystemExit('Release comment marker missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
          cp KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt /tmp/ks-twd-check.js
          node --check /tmp/ks-twd-check.js
          grep -q '^// @version      1.5.134$' KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt
          grep -q 'apiStatus.until - nowMs() / 1000' KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt
          grep -q 'until - nowMs() / 1000' KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt
      - name: Commit test file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs_v1.5.134_HOSPITAL_CLOCK_SYNC_TEST.txt
          git commit -m 'test: KS Torn War Dibs v1.5.134 hospital clock sync'
          git push origin HEAD:test/ks-war-dibs-v1.5.134-hospital-clock-sync
