name: Publish KSBA v5.2.6 direct test link

on:
  push:
    branches:
      - release/ksba-v5.2.6-faction-test
    paths:
      - ".github/workflows/publish-ksba-v526-direct-link.yml"

permissions:
  contents: write

jobs:
  publish-direct-userscript:
    if: github.event.head_commit.message == 'Publish direct KSBA v5.2.6 userscript link'
    runs-on: ubuntu-latest
    steps:
      - name: Check out faction-test branch
        uses: actions/checkout@v4
        with:
          ref: release/ksba-v5.2.6-faction-test
          fetch-depth: 0

      - name: Create direct userscript file
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="faction-tests/KSBA/v5.2.6/01_Kingshades_Bootlegging_Advisor_v5.2.6_FACTION_TEST.txt"
          TARGET="KSBA_v5.2.6_FACTION_TEST.user.js"
          cp "$SOURCE" "$TARGET"
          grep -Eq '^// @version[[:space:]]+5\.2\.6$' "$TARGET"
          grep -Eq '^// @run-at[[:space:]]+document-start$' "$TARGET"

      - name: Commit direct userscript file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f KSBA_v5.2.6_FACTION_TEST.user.js
          git commit -m "Add direct KSBA v5.2.6 faction-test userscript"
          git push origin HEAD:release/ksba-v5.2.6-faction-test
