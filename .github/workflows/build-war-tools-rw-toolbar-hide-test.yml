name: Build War Tools RW Toolbar Hide Test

on:
  push:
    branches: [test/war-tools-rw-toolbar-hide-088]
    paths: [.github/workflows/build-war-tools-rw-toolbar-hide-test.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated 0.8.8 TEST from 0.8.7
        shell: python
        run: |
          from pathlib import Path
          import re
          src=Path('KS_War_Tools_Torn_PDA_v0.8.7.user.js')
          out=Path('KS_War_Tools_Torn_PDA_v0.8.8_RW_TOOLBAR_HIDE_TEST.txt')
          s=src.read_text(encoding='utf-8')
          assert '// @version      0.8.7' in s and 'version: "0.8.7"' in s
          s=s.replace('// @name         KS War Tools for Torn PDA','// @name         KS War Tools for Torn PDA [TEST]',1)
          s=s.replace('// @version      0.8.7','// @version      0.8.8',1)
          s=s.replace('version: "0.8.7"','version: "0.8.8"',1)
          s=s.replace('// @description  Kingshade Suite War Tools for Torn PDA.','// @description  TEST 0.8.8: hides only the War Tools Suite toolbar on Ranked War; row logic remains unchanged.',1)
          anchor='''    function isFactionPage() {\n        return /\\/factions\\.php\\/?$/i.test(location.pathname);\n    }\n'''
          insert=anchor+'''\n    function isRankedWarView() {\n        return Boolean(document.getElementById("faction_war_list_id"));\n    }\n'''
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old='''    function ensureToolbar() {\n        if (state.destroyed || !isFactionPage()) return null;\n        const existing = document.getElementById(SCRIPT.toolbarId);\n'''
          new='''    function ensureToolbar() {\n        if (state.destroyed || !isFactionPage()) return null;\n        if (isRankedWarView()) {\n            document.getElementById(SCRIPT.toolbarId)?.remove();\n            undockScoutButton();\n            return null;\n        }\n        const existing = document.getElementById(SCRIPT.toolbarId);\n'''
          assert old in s
          s=s.replace(old,new,1)
          s=re.sub(r'^// @downloadURL.*\n','',s,count=1,flags=re.M)
          s=re.sub(r'^// @updateURL.*\n','',s,count=1,flags=re.M)
          required=['function isRankedWarView()','faction_war_list_id','if (isRankedWarView()) {','undockScoutButton();','function applyRows()','function renderTimer(']
          assert all(x in s for x in required)
          out.write_text('REDIGERA ETT BEFINTLIGT SCRIPT\n'+s,encoding='utf-8')
      - name: Syntax check
        run: |
          tail -n +2 KS_War_Tools_Torn_PDA_v0.8.8_RW_TOOLBAR_HIDE_TEST.txt >/tmp/war-tools.js
          node --check /tmp/war-tools.js
      - uses: actions/upload-artifact@v4
        with:
          name: KS_War_Tools_Torn_PDA_v0.8.8_RW_TOOLBAR_HIDE_TEST
          path: KS_War_Tools_Torn_PDA_v0.8.8_RW_TOOLBAR_HIDE_TEST.txt
