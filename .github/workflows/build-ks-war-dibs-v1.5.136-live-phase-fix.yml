name: Build KS Torn War Dibs 1.5.136 RW Lock Removed Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ks-war-dibs-v1.5.136-unlock/GO'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ks-war-dibs-v1.5.135-hospital-clock-exact
      - name: Build isolated test version
        shell: bash
        run: |
          set -euo pipefail
          cp KS_Torn_War_Dibs_v1.5.135_HOSPITAL_CLOCK_EXACT_TEST.txt KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt')
          s = p.read_text()
          for old, new in [
              ('// @version      1.5.135', '// @version      1.5.136'),
              ('version: "1.5.135"', 'version: "1.5.136"'),
              ('KS Torn War Dibs v1.5.135 HOSPITAL CLOCK EXACT TEST', 'KS Torn War Dibs v1.5.136 RW LOCK REMOVED TEST'),
          ]:
              if s.count(old) != 1: raise SystemExit(f'mismatch: {old}')
              s = s.replace(old, new, 1)

          gate = '''    if (rwPhase?.phase !== RW_PHASE.LIVE) {
      return {
        state: TARGET_STATE.LOCKED,
        seconds: isHospital ? seconds : null,
        fairFight: ff,
        reason: rwPhase?.phase === RW_PHASE.PREWAR ? "rw-not-started" : "rw-phase-unverifiable",
        mode: "live",
        rwPhase,
        prewarHospital: !!isHospital
      };
    }
'''
          count = s.count(gate)
          if count < 1: raise SystemExit('RW decision gate not found')
          s = s.replace(gate, '')

          panel_old = '''      if (rwState.phase === RW_PHASE.LIVE) {
        $("rw-status").textContent = "DIBS: LIVE";
        $("rw-status").title = "Ranked War is live";
      } else if (rwState.phase === RW_PHASE.PREWAR) {
        $("rw-status").textContent = Number.isFinite(rwState.runwaySeconds)
          ? `DIBS: LOCKED · RW ${formatRwRunway(rwState.runwaySeconds)}`
          : "DIBS: LOCKED · PRE-WAR";
        $("rw-status").title = "DIBS remains disabled until Ranked War starts";
      } else {
        $("rw-status").textContent = "DIBS: LOCKED · RW ?";
        $("rw-status").title = "Ranked War start state cannot be verified; DIBS remains disabled";
      }
'''
          panel_count = s.count(panel_old)
          if panel_count < 1: raise SystemExit('RW panel block not found')
          panel_new = '''      $("rw-status").textContent = "DIBS: ACTIVE";
      $("rw-status").title = "RW start lock removed; Hospital and FF gates remain active";
'''
          s = s.replace(panel_old, panel_new)

          marker = ' * TEST ONLY: Hospital countdown/gating uses FFScouter-aligned second-boundary semantics (ceil + 1s).\n'
          if marker not in s: raise SystemExit('marker missing')
          s = s.replace(marker, marker + ' * TEST ONLY: Ranked War start lock removed; Hospital <=2:00 and FF 2.00-5.00 gates retained.\n', 1)
          p.write_text(s)
          PY
          cp KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt /tmp/check.js
          node --check /tmp/check.js
          grep -q '^// @version      1.5.136$' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          grep -q 'DIBS: ACTIVE' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          ! grep -q 'if (rwPhase?.phase !== RW_PHASE.LIVE)' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          grep -q 'gateSeconds: 120' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          grep -q 'minFairFight: 2.0' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          grep -q 'maxFairFight: 5.0' KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
      - name: Commit test file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs_v1.5.136_RW_LOCK_REMOVED_TEST.txt
          git commit -m 'test: KS Torn War Dibs v1.5.136 remove RW start lock'
          git push origin HEAD:test/ks-war-dibs-v1.5.136-rw-lock-removed
