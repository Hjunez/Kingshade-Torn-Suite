name: Repair Kingshade Suite v0.8.6 update channel

on:
  push:
    branches:
      - fix/v0.8.6-update-channel

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.8.6-update-channel
          fetch-depth: 0

      - name: Build stable update channel and legacy migration files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          repo = "https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main"
          version = Path("VERSION").read_text().strip()
          if version != "0.8.6":
              raise SystemExit(f"Unexpected VERSION {version}; expected 0.8.6")

          pairs = [
              {
                  "current": Path(f"Kingshade_Scout_Torn_PDA_v{version}.user.js"),
                  "stable": Path("Kingshade_Scout_Torn_PDA.user.js"),
                  "legacy": Path("Kingshade_Scout_Torn_PDA_v0.8.5.user.js"),
              },
              {
                  "current": Path(f"KS_War_Tools_Torn_PDA_v{version}.user.js"),
                  "stable": Path("KS_War_Tools_Torn_PDA.user.js"),
                  "legacy": Path("KS_War_Tools_Torn_PDA_v0.8.5.user.js"),
              },
          ]

          def with_update_channel(text: str, stable_name: str) -> str:
              lines = text.splitlines()
              lines = [ln for ln in lines if not ln.startswith("// @downloadURL") and not ln.startswith("// @updateURL")]
              out = []
              inserted = False
              stable_url = f"{repo}/{stable_name}"
              for ln in lines:
                  out.append(ln)
                  if ln.startswith("// @version") and not inserted:
                      out.append(f"// @downloadURL  {stable_url}")
                      out.append(f"// @updateURL    {stable_url}")
                      inserted = True
              if not inserted:
                  raise SystemExit("Could not locate userscript @version metadata")
              return "\n".join(out) + "\n"

          for p in pairs:
              if not p["current"].exists():
                  raise SystemExit(f"Missing current release file: {p['current']}")
              text = with_update_channel(p["current"].read_text(), p["stable"].name)
              p["current"].write_text(text)
              # Stable channel used by every new install and every future update.
              p["stable"].write_text(text)
              # Permanent v0.8.5 compatibility endpoint. Existing v0.8.5 installs
              # already point here via @updateURL/@downloadURL, so returning the
              # current full script migrates them to the stable channel in one click.
              p["legacy"].write_text(text)

          readme = Path("README.md").read_text()
          readme = readme.replace(
              f"{repo}/Kingshade_Scout_Torn_PDA_v{version}.user.js",
              f"{repo}/Kingshade_Scout_Torn_PDA.user.js",
          )
          readme = readme.replace(
              f"{repo}/KS_War_Tools_Torn_PDA_v{version}.user.js",
              f"{repo}/KS_War_Tools_Torn_PDA.user.js",
          )
          marker = "### Suite Control Center"
          note = """### Stable update channel\n\nAll new installs use the unversioned raw URLs above. Scout and War Tools embed those same URLs as `@updateURL` and `@downloadURL`, so Torn PDA can update an existing installation in place when a newer Suite version is published. Permanent v0.8.5 compatibility endpoints are retained so users already on v0.8.5 can migrate by pressing **Update** once; the updated script then switches itself to the stable channel.\n\n"""
          if "### Stable update channel" not in readme:
              readme = readme.replace(marker, note + marker)
          Path("README.md").write_text(readme)

          release_process = Path("docs/RELEASE_PROCESS.md").read_text()
          if "## Userscript update channel" not in release_process:
              release_process += """\n## Userscript update channel\n\n- `Kingshade_Scout_Torn_PDA.user.js` and `KS_War_Tools_Torn_PDA.user.js` are permanent stable update endpoints.\n- Every released Scout/War Tools file must set both `@updateURL` and `@downloadURL` to its matching stable endpoint.\n- The stable endpoint files must be byte-identical to the current versioned release files.\n- The legacy v0.8.5 endpoint filenames remain present and byte-identical to the current release so existing v0.8.5 installations can migrate through Torn PDA's Update action.\n- Release validation must fail if any of those files, URLs or versions drift.\n"""
          Path("docs/RELEASE_PROCESS.md").write_text(release_process)
          PY

          cat > tools/validate-suite.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          cd "$ROOT"

          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          [[ -f VERSION ]] || fail "VERSION is missing."
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "VERSION is not valid semantic versioning: $VERSION"

          SCOUT="Kingshade_Scout_Torn_PDA_v${VERSION}.user.js"
          WAR="KS_War_Tools_Torn_PDA_v${VERSION}.user.js"
          SCOUT_STABLE="Kingshade_Scout_Torn_PDA.user.js"
          WAR_STABLE="KS_War_Tools_Torn_PDA.user.js"
          SCOUT_LEGACY="Kingshade_Scout_Torn_PDA_v0.8.5.user.js"
          WAR_LEGACY="KS_War_Tools_Torn_PDA_v0.8.5.user.js"
          BOOT="Kingshades_Bootlegging_Clean_v4.1.1.user.js"

          for f in "$SCOUT" "$WAR" "$SCOUT_STABLE" "$WAR_STABLE" "$SCOUT_LEGACY" "$WAR_LEGACY" "$BOOT"; do
            [[ -f "$f" ]] || fail "Missing required file: $f"
          done

          for f in "$SCOUT" "$WAR" "$SCOUT_STABLE" "$WAR_STABLE" "$SCOUT_LEGACY" "$WAR_LEGACY"; do
            grep -Eq "^// @version[[:space:]]+${VERSION}$" "$f" || fail "$f metadata version does not match VERSION."
          done

          SCOUT_URL="https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/${SCOUT_STABLE}"
          WAR_URL="https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/${WAR_STABLE}"
          for f in "$SCOUT" "$SCOUT_STABLE" "$SCOUT_LEGACY"; do
            grep -Fq "// @updateURL    ${SCOUT_URL}" "$f" || fail "$f has wrong/missing Scout @updateURL."
            grep -Fq "// @downloadURL  ${SCOUT_URL}" "$f" || fail "$f has wrong/missing Scout @downloadURL."
          done
          for f in "$WAR" "$WAR_STABLE" "$WAR_LEGACY"; do
            grep -Fq "// @updateURL    ${WAR_URL}" "$f" || fail "$f has wrong/missing War Tools @updateURL."
            grep -Fq "// @downloadURL  ${WAR_URL}" "$f" || fail "$f has wrong/missing War Tools @downloadURL."
          done

          cmp -s "$SCOUT" "$SCOUT_STABLE" || fail "Stable Scout endpoint differs from current release."
          cmp -s "$WAR" "$WAR_STABLE" || fail "Stable War Tools endpoint differs from current release."
          cmp -s "$SCOUT" "$SCOUT_LEGACY" || fail "Legacy v0.8.5 Scout migration endpoint differs from current release."
          cmp -s "$WAR" "$WAR_LEGACY" || fail "Legacy v0.8.5 War Tools migration endpoint differs from current release."

          grep -q "$VERSION" README.md || fail "README does not mention Suite version $VERSION."
          grep -q "$VERSION" CHANGELOG.md || fail "CHANGELOG does not mention Suite version $VERSION."

          shopt -s nullglob
          allowed_scout=("$SCOUT" "$SCOUT_STABLE" "$SCOUT_LEGACY")
          allowed_war=("$WAR" "$WAR_STABLE" "$WAR_LEGACY")
          for file in Kingshade_Scout_Torn_PDA*.user.js; do
            [[ " ${allowed_scout[*]} " == *" $file "* ]] || fail "Unexpected Scout copy in repository root: $file"
          done
          for file in KS_War_Tools_Torn_PDA*.user.js; do
            [[ " ${allowed_war[*]} " == *" $file "* ]] || fail "Unexpected War Tools copy in repository root: $file"
          done

          forbidden=(TEST_NOTES_v*.txt KS_Status_Diagnostics*.user.js *.zip)
          for pattern in "${forbidden[@]}"; do
            matches=( $pattern )
            ((${#matches[@]} == 0)) || fail "Forbidden temporary/release file in repository root: ${matches[*]}"
          done

          printf 'Kingshade Suite %s validation passed, including stable and v0.8.5 migration update channels.\n' "$VERSION"
          EOF
          chmod +x tools/validate-suite.sh

          for f in \
            Kingshade_Scout_Torn_PDA_v0.8.6.user.js \
            Kingshade_Scout_Torn_PDA.user.js \
            Kingshade_Scout_Torn_PDA_v0.8.5.user.js \
            KS_War_Tools_Torn_PDA_v0.8.6.user.js \
            KS_War_Tools_Torn_PDA.user.js \
            KS_War_Tools_Torn_PDA_v0.8.5.user.js; do
            node --check "$f"
          done

          bash tools/validate-suite.sh

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Kingshade_Scout_Torn_PDA_v0.8.6.user.js \
            Kingshade_Scout_Torn_PDA.user.js \
            Kingshade_Scout_Torn_PDA_v0.8.5.user.js \
            KS_War_Tools_Torn_PDA_v0.8.6.user.js \
            KS_War_Tools_Torn_PDA.user.js \
            KS_War_Tools_Torn_PDA_v0.8.5.user.js \
            README.md docs/RELEASE_PROCESS.md tools/validate-suite.sh
          if git diff --cached --quiet; then
            echo "No update-channel changes to commit."
            exit 0
          fi
          git commit -m "fix: restore persistent Suite userscript updates"
          git push origin HEAD:fix/v0.8.6-update-channel

      - name: Refresh v0.8.6 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.8.6 \
            Kingshade_Scout_Torn_PDA_v0.8.6.user.js \
            KS_War_Tools_Torn_PDA_v0.8.6.user.js \
            --clobber
