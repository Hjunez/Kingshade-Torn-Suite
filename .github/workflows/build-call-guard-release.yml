name: Build Call Guard release

on:
  push:
    branches:
      - release/ffscouter-call-guard-v1.0.0
    paths:
      - '.release-tmp/**'
      - '.github/workflows/build-call-guard-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/ffscouter-call-guard-v1.0.0

      - name: Assemble and validate userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .release-tmp/call-guard.part*.b64 | base64 -d > KS_FFScouter_Call_Guard.user.js
          cp KS_FFScouter_Call_Guard.user.js KS_FFScouter_Call_Guard_v1.0.0.user.js

          node --check KS_FFScouter_Call_Guard.user.js
          node --check KS_FFScouter_Call_Guard_v1.0.0.user.js
          cmp -s KS_FFScouter_Call_Guard.user.js KS_FFScouter_Call_Guard_v1.0.0.user.js

          grep -Fq '// @version      1.0.0' KS_FFScouter_Call_Guard.user.js
          grep -Fq '// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_FFScouter_Call_Guard.user.js' KS_FFScouter_Call_Guard.user.js
          grep -Fq '// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_FFScouter_Call_Guard.user.js' KS_FFScouter_Call_Guard.user.js

          echo '0fa7db4aca59329946cb4929591b3013a9312c0e6c22ec9ebb4504f01245e34c  KS_FFScouter_Call_Guard.user.js' | sha256sum -c -
          echo '0fa7db4aca59329946cb4929591b3013a9312c0e6c22ec9ebb4504f01245e34c  KS_FFScouter_Call_Guard_v1.0.0.user.js' | sha256sum -c -

      - name: Commit assembled release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-tmp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_FFScouter_Call_Guard.user.js KS_FFScouter_Call_Guard_v1.0.0.user.js .release-tmp
          git commit -m 'Publish KS FFScouter Call Guard v1.0.0'
          git push origin HEAD:release/ffscouter-call-guard-v1.0.0
