name: Build KS Torn War Dibs 1.5.136 DIBS Mount Fix Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ks-war-dibs-v1.5.136/GO'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ks-war-dibs-v1.5.135-hospital-clock-exact
      - name: Build isolated test version
        shell: bash
        run: |
          set -euo pipefail
          cp KS_Torn_War_Dibs_v1.5.135_HOSPITAL_CLOCK_EXACT_TEST.txt KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt')
          s = p.read_text()
          reps = [
              ('// @version      1.5.135', '// @version      1.5.136'),
              ('version: "1.5.135"', 'version: "1.5.136"'),
              ('KS Torn War Dibs v1.5.135 HOSPITAL CLOCK EXACT TEST', 'KS Torn War Dibs v1.5.136 DIBS MOUNT FIX TEST'),
          ]
          for old, new in reps:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)

          old = '''    const width = resolveDibsSlotWidth();
    if (!(Number.isFinite(width) && width > 0)) {
      clearDibsOverlayPlacement(li, host);
      if (host.parentElement) host.remove();
      return;
    }

    const attackCell = li.querySelector(":scope > .attack, :scope > [class*='attack__']");'''
          new = '''    let width = resolveDibsSlotWidth();
    if (!(Number.isFinite(width) && width > 0)) {
      const statusCell = li.querySelector(":scope > .status, :scope > [class*='status__'], :scope > [class*='status']");
      if (statusCell instanceof HTMLElement) {
        const rowRect = li.getBoundingClientRect();
        const statusRect = statusCell.getBoundingClientRect();
        const inferred = rowRect.right - statusRect.right;
        if (Number.isFinite(inferred) && inferred >= 40 && inferred <= 220) width = inferred;
      }
    }
    if (!(Number.isFinite(width) && width > 0)) width = 69;
    dibsSlotWidthPx = width;

    const attackCell = li.querySelector(":scope > .attack, :scope > [class*='attack__']");'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one DIBS placement block, found {count}')
          s = s.replace(old, new, 1)

          marker = ' * TEST ONLY: Hospital countdown/gating uses FFScouter-aligned second-boundary semantics (ceil + 1s).\n'
          insert = marker + ' * TEST ONLY: DIBS host no longer disappears when Torn Attack-column width is temporarily unmeasurable during SPA/pre-war rendering.\n'
          if marker not in s:
              raise SystemExit('Clock test marker missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
          cp KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt /tmp/check.js
          node --check /tmp/check.js
          grep -q '^// @version      1.5.136$' KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt
          grep -q 'if (!(Number.isFinite(width) && width > 0)) width = 69;' KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt
      - name: Commit test file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs_v1.5.136_DIBS_MOUNT_FIX_TEST.txt
          git commit -m 'test: KS Torn War Dibs v1.5.136 DIBS mount fix'
          git push origin HEAD:test/ks-war-dibs-v1.5.136-dibs-mount-fix
