name: Generate KS Torn War Dibs 1.5.133 release branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build verified release branch
        shell: bash
        run: |
          git switch -c generated-ks-war-dibs-1.5.133
          echo '' | base64 -d > /tmp/ks133.patch
          git apply --check /tmp/ks133.patch
          git apply /tmp/ks133.patch
          node --check KS_Torn_War_Dibs.user.js
          grep -q '@version      1.5.133' KS_Torn_War_Dibs.user.js
          grep -q 'version: "1.5.133"' KS_Torn_War_Dibs.user.js
          rm -f .github/workflows/release-ks-war-dibs-1.5.133.yml .release-trigger-1.5.133
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release KS Torn War Dibs v1.5.133 patch'
          git push origin HEAD:generated-ks-war-dibs-1.5.133
