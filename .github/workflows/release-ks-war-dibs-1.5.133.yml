name: Publish KS Torn War Dibs 1.5.133

on:
  push:
    branches:
      - ks-war-dibs-1.5.133-final
    paths:
      - '.tmp/ks133full/GO'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build verified release file
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/ks133full/part-*.b64 | base64 -d | gunzip > KS_Torn_War_Dibs.user.js
          node --check KS_Torn_War_Dibs.user.js
          grep -q '^// @version      1.5.133$' KS_Torn_War_Dibs.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs.user.js
          git rm -r .tmp/ks133full
          git rm -f .github/workflows/release-ks-war-dibs-1.5.133.yml .release-trigger-1.5.133
          git commit -m 'patch: KS Torn War Dibs v1.5.133'
          git push
