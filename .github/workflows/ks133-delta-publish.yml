name: Publish KS War Dibs 1.5.133 delta

on:
  push:
    branches:
      - ks-war-dibs-1.5.133-patch
    paths:
      - '.tmp/ks133delta/GO'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified delta
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/ks133delta/part-*.b64 | base64 -d | gunzip > /tmp/ks133.patch
          git apply --check /tmp/ks133.patch
          git apply /tmp/ks133.patch
          node --check KS_Torn_War_Dibs.user.js
          grep -q '^// @version      1.5.133$' KS_Torn_War_Dibs.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
      - name: Commit patch release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs.user.js
          git rm -r .tmp/ks133delta
          git rm .github/workflows/ks133-delta-publish.yml
          git rm -f .github/workflows/release-ks-war-dibs-1.5.133.yml .release-trigger-1.5.133 || true
          git commit -m 'patch: KS Torn War Dibs v1.5.133'
          git push
