name: TSA Temporary Source Fetch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tsa-temp-fetch.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Greasy Fork source
        run: |
          curl -L --fail --silent --show-error 'https://update.greasyfork.org/scripts/570460/Torn%20Stock%20Analyzer.user.js' -o Torn_Stock_Analyzer_v2.37.0_ORIGINAL.txt
          test -s Torn_Stock_Analyzer_v2.37.0_ORIGINAL.txt
          grep -q '^// ==UserScript==$' Torn_Stock_Analyzer_v2.37.0_ORIGINAL.txt
          grep -q '^// @version[[:space:]]\+2\.37\.0$' Torn_Stock_Analyzer_v2.37.0_ORIGINAL.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Torn_Stock_Analyzer_v2.37.0_ORIGINAL
          path: Torn_Stock_Analyzer_v2.37.0_ORIGINAL.txt
          if-no-files-found: error
