name: Build KS Torn War Dibs v1.5.138 final release branch

on:
  push:
    branches:
      - ops/v15138-final-builder
    paths:
      - '.tmp/v15138-final-builder/GO'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build verified v1.5.138 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/ks-war-dibs-v1.5.135-hospital-clock-exact
          git show origin/test/ks-war-dibs-v1.5.135-hospital-clock-exact:KS_Torn_War_Dibs_v1.5.135_HOSPITAL_CLOCK_EXACT_TEST.txt > /tmp/KS_Torn_War_Dibs_v1.5.135.txt
          cp /tmp/KS_Torn_War_Dibs_v1.5.135.txt /tmp/KS_Torn_War_Dibs.user.js
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/KS_Torn_War_Dibs.user.js')
          s = p.read_text()

          replacements = [
              ('// @version      1.5.135', '// @version      1.5.138'),
              ('version: "1.5.135"', 'version: "1.5.138"'),
              ('KS Torn War Dibs v1.5.135 HOSPITAL CLOCK EXACT TEST', 'KS Torn War Dibs v1.5.138 RW CLAIM GUARD REMOVED TEST'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'mismatch: {old} -> {s.count(old)}')
              s = s.replace(old, new, 1)

          gate = '''    if (rwPhase?.phase !== RW_PHASE.LIVE) {
            return {
              state: TARGET_STATE.LOCKED,
              seconds: isHospital ? seconds : null,
              fairFight: ff,
              reason: rwPhase?.phase === RW_PHASE.PREWAR ? "rw-not-started" : "rw-phase-unverifiable",
              mode: "live",
              rwPhase,
              prewarHospital: !!isHospital
            };
          }
          '''
          gate = gate.replace('          ', '', 1)
          if s.count(gate) != 1:
              raise SystemExit(f'RW decision gate mismatch: {s.count(gate)}')
          s = s.replace(gate, '', 1)

          hidden = '''    const rwPhase = currentRwPhase();
          if (rwPhase.phase !== RW_PHASE.LIVE) { scanWarRows(); return; }

          const eligibility = currentDecisionForTarget(targetId);
          '''
          hidden = hidden.replace('          ', '', 1)
          if s.count(hidden) != 1:
              raise SystemExit(f'hidden claim guard mismatch: {s.count(hidden)}')
          s = s.replace(hidden, '    const eligibility = currentDecisionForTarget(targetId);\n', 1)

          panel_old = '''      if (rwState.phase === RW_PHASE.LIVE) {
            $("rw-status").textContent = "DIBS: LIVE";
            $("rw-status").title = "Ranked War is live";
          } else if (rwState.phase === RW_PHASE.PREWAR) {
            $("rw-status").textContent = Number.isFinite(rwState.runwaySeconds)
              ? `DIBS: LOCKED · RW ${formatRwRunway(rwState.runwaySeconds)}`
              : "DIBS: LOCKED · PRE-WAR";
            $("rw-status").title = "DIBS remains disabled until Ranked War starts";
          } else {
            $("rw-status").textContent = "DIBS: LOCKED · RW ?";
            $("rw-status").title = "Ranked War start state cannot be verified; DIBS remains disabled";
          }
          '''
          panel_old = panel_old.replace('          ', '', 1)
          if s.count(panel_old) != 1:
              raise SystemExit(f'RW panel block mismatch: {s.count(panel_old)}')
          panel_new = '''      $("rw-status").textContent = "DIBS: ACTIVE";
      $("rw-status").title = "RW start lock removed; Hospital and FF gates remain active";
'''
          s = s.replace(panel_old, panel_new, 1)

          marker = ' * TEST ONLY: Hospital countdown/gating uses FFScouter-aligned second-boundary semantics (ceil + 1s).\n'
          if s.count(marker) == 1:
              s = s.replace(marker, ' * Hospital countdown uses v1.5.135 FFScouter-aligned second-boundary semantics.\n * TEST ONLY: RW start lock removed. Hospital <=2:00 and FF 2.00-5.00 gates retained.\n', 1)

          p.write_text(s)
          PY

          node --check /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @version      1.5.138$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'DIBS: ACTIVE' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'DIBS: LOCKED · RW' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'if (rwPhase?.phase !== RW_PHASE.LIVE)' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'if (rwPhase.phase !== RW_PHASE.LIVE) { scanWarRows(); return; }' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'gateSeconds: 120' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'minFairFight: 2.0' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'maxFairFight: 5.0' /tmp/KS_Torn_War_Dibs.user.js

      - name: Commit payload to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B release/ks-war-dibs-v1.5.138-final origin/main
          cp /tmp/KS_Torn_War_Dibs.user.js KS_Torn_War_Dibs.user.js
          git add KS_Torn_War_Dibs.user.js
          git diff --cached --quiet && { echo 'No release diff'; exit 1; }
          git commit -m 'release: KS Torn War Dibs v1.5.138'
          git push --force origin release/ks-war-dibs-v1.5.138-final
