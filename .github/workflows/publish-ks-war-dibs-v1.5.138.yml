name: Build KS Torn War Dibs v1.5.138 final release branch

on:
  push:
    branches:
      - main
      - ops/v15138-final-builder
    paths:
      - '.tmp/v15138-final-builder/GO'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build verified v1.5.138 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/ks-war-dibs-v1.5.135-hospital-clock-exact
          git show origin/test/ks-war-dibs-v1.5.135-hospital-clock-exact:KS_Torn_War_Dibs_v1.5.135_HOSPITAL_CLOCK_EXACT_TEST.txt > /tmp/base135.txt
          cp /tmp/base135.txt /tmp/KS_Torn_War_Dibs.user.js
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/KS_Torn_War_Dibs.user.js')
          s = p.read_text()

          for old, new in [
              ('// @version      1.5.135', '// @version      1.5.138'),
              ('version: "1.5.135"', 'version: "1.5.138"'),
              ('KS Torn War Dibs v1.5.135 HOSPITAL CLOCK EXACT TEST', 'KS Torn War Dibs v1.5.138 RW CLAIM GUARD REMOVED TEST'),
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f'metadata mismatch: {old} -> {s.count(old)}')
              s = s.replace(old, new, 1)

          decision_start_text = '    if (rwPhase?.phase !== RW_PHASE.LIVE) {\n'
          decision_next_text = '    if (!isHospital) return { state: TARGET_STATE.UNAVAILABLE'
          if s.count(decision_start_text) != 1 or s.count(decision_next_text) != 1:
              raise SystemExit('decision guard anchors mismatch')
          a = s.index(decision_start_text)
          b = s.index(decision_next_text, a)
          s = s[:a] + s[b:]

          hidden = '    const rwPhase = currentRwPhase();\n    if (rwPhase.phase !== RW_PHASE.LIVE) { scanWarRows(); return; }\n\n    const eligibility = currentDecisionForTarget(targetId);\n'
          if s.count(hidden) != 1:
              raise SystemExit(f'hidden claim guard mismatch: {s.count(hidden)}')
          s = s.replace(hidden, '    const eligibility = currentDecisionForTarget(targetId);\n', 1)

          panel_start_text = '    if ($("rw-status")) {\n'
          panel_next_text = '    if (countryItem) {\n'
          if s.count(panel_start_text) != 1:
              raise SystemExit(f'panel start mismatch: {s.count(panel_start_text)}')
          a = s.index(panel_start_text)
          b = s.index(panel_next_text, a)
          panel = '    if ($("rw-status")) {\n      $("rw-status").textContent = "DIBS: ACTIVE";\n      $("rw-status").title = "RW start lock removed; Hospital and FF gates remain active";\n    }\n'
          s = s[:a] + panel + s[b:]

          marker = ' * TEST ONLY: Hospital countdown/gating uses FFScouter-aligned second-boundary semantics (ceil + 1s).\n'
          if s.count(marker) != 1:
              raise SystemExit(f'header marker mismatch: {s.count(marker)}')
          s = s.replace(marker, ' * Hospital countdown uses v1.5.135 FFScouter-aligned second-boundary semantics.\n * TEST ONLY: RW start lock removed. Hospital <=2:00 and FF 2.00-5.00 gates retained.\n', 1)

          p.write_text(s)
          PY

          node --check /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @version      1.5.138$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'DIBS: ACTIVE' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'DIBS: LOCKED · RW' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'if (rwPhase?.phase !== RW_PHASE.LIVE)' /tmp/KS_Torn_War_Dibs.user.js
          ! grep -q 'if (rwPhase.phase !== RW_PHASE.LIVE) { scanWarRows(); return; }' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'gateSeconds: 120' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'minFairFight: 2.0' /tmp/KS_Torn_War_Dibs.user.js
          grep -q 'maxFairFight: 5.0' /tmp/KS_Torn_War_Dibs.user.js

      - name: Commit payload to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B release/ks-war-dibs-v1.5.138-final origin/main
          cp /tmp/KS_Torn_War_Dibs.user.js KS_Torn_War_Dibs.user.js
          git add KS_Torn_War_Dibs.user.js
          git diff --cached --quiet && { echo 'No release diff'; exit 1; }
          git commit -m 'release: KS Torn War Dibs v1.5.138'
          git push --force origin release/ks-war-dibs-v1.5.138-final
