name: Publish KS War Dibs 1.5.128

on:
  push:
    branches:
      - ks-war-dibs-1.5.128-patch
    paths:
      - '.tmp/ks128/GO'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/ks128/part-*.b64 | base64 -d > KS_Torn_War_Dibs.user.js
          node --check KS_Torn_War_Dibs.user.js
          grep -q '^// @version      1.5.128$' KS_Torn_War_Dibs.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/Hjunez/Kingshade-Torn-Suite/main/KS_Torn_War_Dibs.user.js$' KS_Torn_War_Dibs.user.js
      - name: Commit patch release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KS_Torn_War_Dibs.user.js
          git rm -r .tmp/ks128
          git rm .github/workflows/ks128-publish.yml
          git commit -m 'patch: KS Torn War Dibs v1.5.128'
          git push
