<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KS Torn War Dibs deterministic fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: #10141b;
        color: #e8edf4;
        font-family: Arial, sans-serif;
      }

      .faction-war,
      .enemy-faction {
        width: 100%;
      }

      .white-grad,
      li.enemy {
        display: flex;
        position: relative;
        width: 100%;
        height: 42px;
        min-height: 42px;
        align-items: stretch;
      }

      .white-grad {
        background: #252d39;
      }

      ul.members-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li.enemy {
        border-bottom: 1px solid #3d4755;
        background: #18202a;
      }

      .member {
        display: flex;
        flex: 1 1 auto;
        min-width: 300px;
        padding: 4px 8px;
        flex-direction: column;
        justify-content: center;
        overflow: visible;
      }

      .member .name,
      .member .player-title {
        display: block;
        max-width: 100%;
        color: #eef4ff;
        line-height: 15px;
        white-space: nowrap;
      }

      .member .name {
        font-size: 12px;
        font-weight: 700;
      }

      .member .player-title {
        color: #aebbd0;
        font-size: 11px;
      }

      .member .player-title:empty {
        display: none;
      }

      .level,
      .points,
      .status {
        display: block;
        flex: 0 0 auto;
        height: 42px;
        line-height: 42px;
        text-align: center;
      }

      .level {
        width: 100px;
      }

      .points {
        width: 52px;
      }

      .status {
        width: 128px;
      }

      .attack,
      .action-cell {
        flex: 0 0 96px;
        width: 96px;
        height: 42px;
        line-height: 42px;
        text-align: center;
      }

      @media (max-width: 783px) {
        .white-grad,
        li.enemy {
          width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main class="faction-war">
      <section class="enemy-faction" data-test-war-scope>
        <div class="white-grad table-header">
          <div class="member">Member</div>
          <div class="level">Level</div>
          <div class="status">Status</div>
          <div class="attack">Attack</div>
        </div>
        <div id="faction_war_list_id">
          <li class="act" role="button">Ranked War</li>
          <ul class="members-list" data-test-enemy-rows></ul>
        </div>
      </section>
    </main>
  </body>
</html>
